<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Фон: мягкий тёплый градиент как на картинке -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#FAF4EB"/>
      <stop offset="60%" stop-color="#F5ECE0"/>
      <stop offset="100%" stop-color="#EFE2D3"/>
    </radialGradient>

    <!-- Мягкие тени для облаков и звёзд -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#C5A88E" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#B2947A" flood-opacity="0.2" />
    </filter>

    <filter id="starShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#C99E64" flood-opacity="0.3" />
    </filter>

    <!-- Градиент облака -->
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#FAF4ED"/>
      <stop offset="100%" stop-color="#F2E6D8"/>
    </linearGradient>

    <!-- Градиент звёзд -->
    <linearGradient id="starGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEDE7B"/>
      <stop offset="100%" stop-color="#EDB34C"/>
    </linearGradient>

    <!-- Символ ромашки -->
    <g id="daisy">
      <ellipse cx="-13" cy="0" rx="9" ry="4.5" fill="#FFFDF8"/>
      <ellipse cx="13" cy="0" rx="9" ry="4.5" fill="#FFFDF8"/>
      <ellipse cx="0" cy="-13" rx="4.5" ry="9" fill="#FFFDF8"/>
      <ellipse cx="0" cy="13" rx="4.5" ry="9" fill="#FFFDF8"/>
      <ellipse cx="-9" cy="-9" rx="8" ry="4.5" transform="rotate(45 -9 -9)" fill="#FFF9ED"/>
      <ellipse cx="9" cy="9" rx="8" ry="4.5" transform="rotate(45 9 9)" fill="#FFF9ED"/>
      <ellipse cx="-9" cy="9" rx="8" ry="4.5" transform="rotate(-45 -9 9)" fill="#FFF9ED"/>
      <ellipse cx="9" cy="-9" rx="8" ry="4.5" transform="rotate(-45 9 -9)" fill="#FFF9ED"/>
      <circle cx="0" cy="0" r="6" fill="#F4BA46"/>
      <circle cx="0" cy="0" r="4.5" fill="#EDB037"/>
    </g>

    <!-- Символ маленькой звёздочки -->
    <g id="star3d">
      <path filter="url(#starShadow)" fill="url(#starGrad)" d="M 0 -16 Q 2 -5 13 -5 Q 4 2 8 14 Q 0 7 -8 14 Q -4 2 -13 -5 Q -2 -5 0 -16 Z" />
      <circle cx="0" cy="0" r="3.2" fill="#E59E33" opacity="0.45" />
    </g>

    <style>
      /* --- ПЛАВАНИЕ ОБЛАКОВ --- */
      .floating-cloud-left {
        animation: floatL 7s ease-in-out infinite;
      }
      .floating-cloud-right {
        animation: floatR 8.5s ease-in-out infinite;
      }
      @keyframes floatL {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(3px, -7px); }
      }
      @keyframes floatR {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-4px, -8px); }
      }

      /* --- МОРГАНИЕ ГЛАЗ (раз в 6-7 секунд, быстро и мило) --- */
      .eye-blink-left {
        transform-origin: 180px 315px;
        animation: blink 6.5s infinite;
      }
      .eye-blink-right {
        transform-origin: 1370px 172px;
        animation: blink 7.8s infinite 1.2s;
      }
      @keyframes blink {
        0%, 46%, 50%, 96%, 100% { transform: scaleY(1); }
        48%, 98% { transform: scaleY(0.08); }
      }

      /* --- УЛЫБКА ОБЛАКА (мягкое лёгкое движение) --- */
      .cloud-smile {
        transform-origin: center;
        animation: gentleSmile 6.5s ease-in-out infinite;
      }
      @keyframes gentleSmile {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08, 0.95); }
      }

      /* --- КОЛЫХАНИЕ ЦВЕТОВ НА ВЕТРУ (очень мягкое, точка вращения внизу у стебля) --- */
      .sway-bush-1 {
        transform-origin: 120px 900px;
        animation: sway1 6.5s ease-in-out infinite;
      }
      .sway-bush-2 {
        transform-origin: 260px 900px;
        animation: sway2 7.8s ease-in-out infinite 0.5s;
      }
      .sway-bush-3 {
        transform-origin: 1250px 900px;
        animation: sway2 8.2s ease-in-out infinite 1s;
      }
      .sway-bush-4 {
        transform-origin: 1450px 900px;
        animation: sway1 7.2s ease-in-out infinite 0.3s;
      }
      @keyframes sway1 {
        0%, 100% { transform: rotate(0deg); }
        40% { transform: rotate(1.2deg); }
        75% { transform: rotate(-0.8deg); }
      }
      @keyframes sway2 {
        0%, 100% { transform: rotate(0deg); }
        35% { transform: rotate(-1.3deg); }
        70% { transform: rotate(0.9deg); }
      }

      /* --- ЕДВА ЗАМЕТНОЕ ВРАЩЕНИЕ ЗВЁЗДОЧЕК --- */
      .star-rotate-cw {
        animation: starTurnCw 14s ease-in-out infinite;
      }
      .star-rotate-ccw {
        animation: starTurnCcw 18s ease-in-out infinite;
      }
      @keyframes starTurnCw {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(14deg); }
      }
      @keyframes starTurnCcw {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-15deg); }
      }

      /* Маленькие контурные звездочки: мягкое мерцание */
      .star-twinkle {
        animation: twinkle 5s ease-in-out infinite;
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.12); }
      }
    </style>
  </defs>

  <!-- ================= ФОН ================= -->
  <rect width="1600" height="900" fill="url(#bgGlow)" />

  <!-- ================= СТАТИЧНЫЕ МЕЛКИЕ ЗВЁЗДЫ И ТОЧКИ ================= -->
  <!-- Контурные звездочки -->
  <g stroke="#C69E7B" stroke-width="1.3" fill="none" opacity="0.6">
    <path class="star-twinkle" style="transform-origin: 570px 110px;" d="M 570 102 L 572 108 L 578 108 L 573 112 L 575 118 L 570 114 L 565 118 L 567 112 L 562 108 L 568 108 Z"/>
    <path class="star-twinkle" style="transform-origin: 1290px 475px; animation-delay: 2s;" d="M 1290 468 L 1292 473 L 1297 473 L 1293 477 L 1295 482 L 1290 479 L 1285 482 L 1287 477 L 1283 473 L 1288 473 Z"/>
    <path class="star-twinkle" style="transform-origin: 310px 480px; animation-delay: 1.2s;" d="M 310 473 L 312 478 L 317 478 L 313 481 L 315 486 L 310 483 L 305 486 L 307 481 L 303 478 L 308 478 Z"/>
    <path class="star-twinkle" style="transform-origin: 1245px 740px; animation-delay: 2.7s;" d="M 1245 734 L 1247 739 L 1252 739 L 1248 742 L 1250 747 L 1245 744 L 1240 747 L 1242 742 L 1238 739 L 1243 739 Z"/>
  </g>

  <!-- ================= ОБЛАКО 1 (СЛЕВА ВВЕРХУ) ================= -->
  <g class="floating-cloud-left">
    <!-- Тело облака с мягкой тенью -->
    <g filter="url(#cloudShadow)">
      <path fill="url(#cloudGrad)" d="
        M 100 325 
        C 75 325, 60 305, 65 285 
        C 70 265, 95 255, 115 260 
        C 125 240, 150 230, 175 235 
        C 195 215, 230 218, 245 242 
        C 265 245, 280 265, 275 290 
        C 275 315, 250 330, 230 325 
        Z" />
    </g>

    <!-- Личико облака: щечки, глаза, ротик -->
    <g>
      <!-- Розовые щёчки -->
      <circle cx="140" cy="316" r="8" fill="#F89D91" opacity="0.65" />
      <circle cx="215" cy="316" r="8" fill="#F89D91" opacity="0.65" />

      <!-- Глазки (с морганием) -->
      <g class="eye-blink-left">
        <circle cx="150" cy="305" r="4.2" fill="#3B2A22" />
        <circle cx="148.8" cy="303.5" r="1.3" fill="#FFFFFF" />

        <circle cx="205" cy="305" r="4.2" fill="#3B2A22" />
        <circle cx="203.8" cy="303.5" r="1.3" fill="#FFFFFF" />
      </g>

      <!-- Улыбка -->
      <path class="cloud-smile" d="M 172 313 Q 177 319 183 313" fill="none" stroke="#3B2A22" stroke-width="2.3" stroke-linecap="round" />
    </g>
  </g>

  <!-- ================= ОБЛАКО 2 (СПРАВА ВВЕРХУ, БОЛЬШОЕ) ================= -->
  <g class="floating-cloud-right">
    <g filter="url(#cloudShadow)">
      <path fill="url(#cloudGrad)" d="
        M 1230 185
        C 1180 185, 1160 145, 1185 110
        C 1205 75, 1260 70, 1290 95
        C 1315 50, 1385 45, 1425 78
        C 1465 55, 1525 75, 1535 125
        C 1565 155, 1545 205, 1500 215
        C 1465 230, 1420 220, 1395 200
        C 1360 220, 1290 220, 1265 195
        C 1250 195, 1240 190, 1230 185
        Z" />
    </g>

    <!-- Личико большого облака -->
    <g>
      <!-- Щёчки -->
      <circle cx="1310" cy="173" r="14" fill="#F89D91" opacity="0.65" />
      <circle cx="1430" cy="173" r="14" fill="#F89D91" opacity="0.65" />

      <!-- Глазки -->
      <g class="eye-blink-right">
        <circle cx="1328" cy="155" r="6" fill="#3B2A22" />
        <circle cx="1326" cy="153" r="2" fill="#FFFFFF" />

        <circle cx="1412" cy="155" r="6" fill="#3B2A22" />
        <circle cx="1410" cy="153" r="2" fill="#FFFFFF" />
      </g>

      <!-- Улыбка -->
      <path class="cloud-smile" d="M 1362 168 Q 1370 177 1378 168" fill="none" stroke="#3B2A22" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- ================= ЗВЁЗДОЧКИ (МЯГКО ПОВОРАЧИВАЮТСЯ) ================= -->
  <!-- Около левого облака -->
  <g class="star-rotate-cw" style="transform-origin: 50px 220px;">
    <use href="#star3d" x="50" y="220" transform="scale(0.85)" />
  </g>
  <g class="star-rotate-ccw" style="transform-origin: 110px 530px;">
    <use href="#star3d" x="110" y="530" transform="scale(0.95)" />
  </g>
  <g class="star-rotate-cw" style="transform-origin: 235px 115px;">
    <use href="#star3d" x="235" y="115" transform="scale(0.9)" />
  </g>

  <!-- Около правого облака и по правому краю -->
  <g class="star-rotate-ccw" style="transform-origin: 1090px 105px;">
    <use href="#star3d" x="1090" y="105" transform="scale(0.95)" />
  </g>
  <g class="star-rotate-cw" style="transform-origin: 1430px 425px;">
    <use href="#star3d" x="1430" y="425" transform="scale(0.85)" />
  </g>
  <g class="star-rotate-ccw" style="transform-origin: 1420px 680px;">
    <use href="#star3d" x="1420" y="680" transform="scale(1.1)" />
  </g>

  <!-- ================= ЦВЕТОЧНЫЙ НИЖНИЙ ЛУГ ================= -->
  <!-- ЛЕВЫЙ КУСТИК: Фетровая звёздочка на стебле + ромашки -->
  <g class="sway-bush-1">
    <!-- Стебель звёздочки -->
    <path d="M 130 900 Q 150 820 180 750" fill="none" stroke="#8F9B7E" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Большая фетровая звёздочка на палочке -->
    <g transform="translate(180, 750) rotate(10)" filter="url(#cloudShadow)">
      <path fill="#F4BD4C" stroke="#E6AA3A" stroke-width="2" d="M 0 -55 Q 8 -16 45 -16 Q 16 10 27 50 Q 0 24 -27 50 Q -16 10 -45 -16 Q -8 -16 0 -55 Z" />
      <circle cx="0" cy="5" r="19" fill="#FCDA7E" stroke="#DF9E33" stroke-width="2" />
      <circle cx="0" cy="5" r="9" fill="#E8A738" />
    </g>
  </g>

  <g class="sway-bush-2">
    <!-- Стебли и ромашки слева -->
    <path d="M 70 900 Q 80 810 50 740" fill="none" stroke="#97A384" stroke-width="3" stroke-linecap="round"/>
    <path d="M 70 820 Q 100 800 110 770" fill="none" stroke="#97A384" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 230 900 Q 250 830 240 760" fill="none" stroke="#97A384" stroke-width="3" stroke-linecap="round"/>
    <path d="M 240 840 Q 280 820 290 790" fill="none" stroke="#97A384" stroke-width="2" stroke-linecap="round"/>

    <!-- Ромашки на стеблях -->
    <use href="#daisy" x="50" y="740" transform="scale(1.2)" />
    <use href="#daisy" x="110" y="770" transform="scale(0.85)" />
    <use href="#daisy" x="240" y="760" transform="scale(1.1)" />
    <use href="#daisy" x="290" y="790" transform="scale(0.75)" />

    <!-- Маленькие бутоны -->
    <circle cx="320" cy="850" r="4.5" fill="#E4C882" />
    <circle cx="360" cy="840" r="5" fill="#E4C882" />
    <path d="M 320 900 L 320 850 M 360 900 L 360 840" stroke="#97A384" stroke-width="2" />
  </g>

  <!-- ПРАВЫЙ КУСТИК: Ромашки и тёплые жёлтые цветы -->
  <g class="sway-bush-3">
    <!-- Стебли -->
    <path d="M 1150 900 Q 1160 840 1170 780" fill="none" stroke="#97A384" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 1250 900 Q 1240 820 1260 760" fill="none" stroke="#97A384" stroke-width="3" stroke-linecap="round"/>
    <path d="M 1330 900 Q 1315 820 1310 740" fill="none" stroke="#97A384" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Цветы -->
    <!-- Жёлтый колокольчик / чашечка -->
    <path d="M 1160 785 C 1155 770, 1185 770, 1180 785 Z" fill="#F4BF54" />
    <use href="#daisy" x="1260" y="760" transform="scale(1.15)" />
    
    <!-- Крупная ромашка справа -->
    <g transform="translate(1415, 765) scale(1.45)">
      <use href="#daisy" />
    </g>
  </g>

  <g class="sway-bush-4">
    <!-- Стебли у самого правого края -->
    <path d="M 1420 900 Q 1430 830 1415 765" fill="none" stroke="#8F9B7E" stroke-width="4" stroke-linecap="round"/>
    <path d="M 1480 900 Q 1490 840 1475 790" fill="none" stroke="#97A384" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 1540 900 Q 1530 810 1550 750" fill="none" stroke="#97A384" stroke-width="2.5" stroke-linecap="round"/>

    <use href="#daisy" x="1475" y="790" transform="scale(0.9)" />
    <!-- Жёлтые веточки и бутоны -->
    <circle cx="1550" cy="750" r="5.5" fill="#E8B854" />
    <circle cx="1520" cy="720" r="4.5" fill="#F3DFB4" />
    <path d="M 1520 770 L 1520 720" stroke="#97A384" stroke-width="2" />
  </g>
</svg>
